{% extends 'home/base.html' %}
{% block title %}FAQ - JETFLIX{% endblock %}
{% block content %}
<div style="max-width:800px;margin:60px auto;padding:0 20px;">
  <h1 style="color:#fff;margin-bottom:8px;">Frequently Asked Questions</h1>
  <p style="color:#888;margin-bottom:40px;">Everything you need to know about JETFLIX.</p>

  {% for q, a in faqs %}
  <div style="border-bottom:1px solid #2a2a2a;padding:20px 0;">
    <h3 style="color:#fff;font-size:1rem;margin-bottom:8px;">{{ q }}</h3>
    <p style="color:#aaa;font-size:0.9rem;line-height:1.6;">{{ a }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
