{% extends 'home/base.html' %}
{% block title %}Help Center - JETFLIX{% endblock %}
{% block content %}
<div style="max-width:800px;margin:60px auto;padding:0 20px;">
  <h1 style="color:#fff;margin-bottom:8px;">Help Center</h1>
  <p style="color:#888;margin-bottom:40px;">Find answers and get support.</p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:40px;">
    {% for topic in topics %}
    <div style="background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;padding:20px;">
      <h3 style="color:#fff;font-size:0.95rem;margin-bottom:8px;">{{ topic.title }}</h3>
      <p style="color:#aaa;font-size:0.85rem;line-height:1.6;">{{ topic.body }}</p>
    </div>
    {% endfor %}
  </div>

  <div style="background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;padding:24px;text-align:center;">
    <p style="color:#aaa;margin-bottom:12px;">Still need help?</p>
    <a href="{% url 'contact' %}" style="color:#e50914;text-decoration:none;font-weight:600;">Contact Us →</a>
  </div>
</div>
{% endblock %}
